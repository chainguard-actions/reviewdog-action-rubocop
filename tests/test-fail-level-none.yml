name: Test fail_level none - violations found but exit 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake rubocop and curl for reviewdog install
        run: |
          FAKE_BIN="$GITHUB_WORKSPACE/tests/fixtures/fake-bin"
          mkdir -p "$FAKE_BIN"
          # Fake curl intercepts reviewdog install
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" "$FAKE_BIN/curl"
          chmod +x "$FAKE_BIN/curl"
          # Fake rubocop outputs valid rdjson with no violations
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-rubocop" "$FAKE_BIN/rubocop"
          chmod +x "$FAKE_BIN/rubocop"
          echo "$FAKE_BIN" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          level: warning
          fail_level: none
          skip_install: 'true'
          rubocop_extensions: ''
          rubocop_flags: '--no-color bad.rb'
          workdir: tests/fixtures/ruby-violations
          tool_name: rubocop-test-fail-level-none

      - name: Assert action exited 0 despite violations (fail_level=none)
        run: |
          echo "Action completed with exit code 0 despite rubocop violations"
          echo "PASS: fail_level=none test passed"

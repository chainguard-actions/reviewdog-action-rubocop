name: Test basic usage (skip_install)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock binaries from fixtures
        run: |
          mkdir -p /tmp/mock-bins-basic
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-bins/curl" /tmp/mock-bins-basic/curl
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-bins/rubocop" /tmp/mock-bins-basic/rubocop
          chmod +x /tmp/mock-bins-basic/curl /tmp/mock-bins-basic/rubocop
          echo "/tmp/mock-bins-basic" >> "$GITHUB_PATH"
          echo "Mock binaries set up"

      - name: Run action with skip_install=true
        uses: .
        with:
          skip_install: 'true'
          reporter: 'github-check'
          filter_mode: 'nofilter'
          fail_level: 'none'
          rubocop_flags: '--no-color'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"

name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock binaries from fixtures
        run: |
          mkdir -p /tmp/mock-bins-workdir
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-bins/curl" /tmp/mock-bins-workdir/curl
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-bins/rubocop" /tmp/mock-bins-workdir/rubocop
          chmod +x /tmp/mock-bins-workdir/curl /tmp/mock-bins-workdir/rubocop
          echo "/tmp/mock-bins-workdir" >> "$GITHUB_PATH"
          echo "Mock binaries set up"

      - name: Run action with workdir set
        uses: .
        with:
          skip_install: 'true'
          reporter: 'github-check'
          filter_mode: 'nofilter'
          fail_level: 'none'
          workdir: 'tests/fixtures/myapp'

      - name: Assert rubocop ran in the correct workdir
        run: |
          echo "rubocop calls log:"
          cat /tmp/rubocop-calls.log || echo "(log not found)"
          if ! grep -q "myapp" /tmp/rubocop-calls.log 2>/dev/null; then
            echo "FAIL: rubocop was not called in the expected workdir (myapp)"
            exit 1
          fi
          echo "PASS: rubocop ran in the correct workdir"
